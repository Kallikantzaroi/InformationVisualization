<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Met Collection – Objects by Country</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 20px 30px 30px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    svg {
      background: #ffffff;
      border-radius: 8px;
    }

    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
      font-size: 13px;
    }

    .legend text {
      font-size: 12px;
      alignment-baseline: middle;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Number of Met Objects by Country</h2>
  <svg id="map" width="1000" height="600"></svg>
</div>

<div class="tooltip" style="opacity:0"></div>

<script>
const CSV_FILE = "MetObjects.csv";

Promise.all([
  d3.json("country_counts.json"),
  d3.json("https://unpkg.com/world-atlas@2/countries-110m.json")
]).then(([countryCountsObj, world]) => {

  const countryCounts = new Map(Object.entries(countryCountsObj));

  const svg = d3.select("#map");
  const width = +svg.attr("width");
  const height = +svg.attr("height");
  const tooltip = d3.select('.tooltip');

  const projection = d3.geoNaturalEarth1()
    .scale(180)
    .translate([width / 2, height / 2]);

  const path = d3.geoPath().projection(projection);
  const countries = topojson.feature(world, world.objects.countries).features;

  function countryColor(count) {
    if (!count || count === 0) return "#e0e0e0";
    if (count <= 10) return "#ede6fa";
    if (count <= 50) return "#dcd0ff";
    if (count <= 150) return "#c2a3ff";
    if (count <= 600) return "#9a6bff";
    if (count <= 1500) return "#6f2dff";
    if (count <= 20000) return "#3b008f";
    return "#1a001f";
  }

  svg.selectAll("path")
    .data(countries)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", d => {
      const name = d.properties.name;
      const count = countryCounts.get(name);
      return countryColor(+count || 0);
    })
    .attr("stroke", "#666")
    .attr("stroke-width", 0.5)
    .on("mousemove", (event, d) => {
      const name = d.properties.name;
      const count = countryCounts.get(name) || 0;
      tooltip
        .style("opacity", 1)
        .html(`<strong>${name}</strong><br/>Objects: ${count}`)
        .style("left", (event.pageX + 10) + "px")
        .style("top", (event.pageY + 10) + "px");
    })
    .on("mouseout", () => tooltip.style("opacity", 0));

  // LEGEND
  const legendData = [
    { label: "0", color: "#e0e0e0" },
    { label: "1–10", color: "#ede6fa" },
    { label: "11–50", color: "#dcd0ff" },
    { label: "51–150", color: "#c2a3ff" },
    { label: "151–600", color: "#9a6bff" },
    { label: "601–1500", color: "#6f2dff" },
    { label: "1501–20000", color: "#3b008f" },
    { label: "> 20000", color: "#1a001f" }
  ];

  const legend = svg.append("g")
    .attr("class", "legend")
    .attr("transform", "translate(20,350)");

  legend.selectAll("rect")
    .data(legendData)
    .enter()
    .append("rect")
    .attr("x", 0)
    .attr("y", (d, i) => i * 24)
    .attr("width", 18)
    .attr("height", 18)
    .attr("fill", d => d.color);

  legend.selectAll("text")
    .data(legendData)
    .enter()
    .append("text")
    .attr("x", 28)
    .attr("y", (d, i) => i * 24 + 13)
    .text(d => d.label);
});
</script>

</body>
</html>
