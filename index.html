<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MET Collection</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 20px 30px 30px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    svg {
      background: #ffffff;
      border-radius: 8px;
    }

    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
      font-size: 13px;
    }

    .legend text {
      font-size: 12px;
      alignment-baseline: middle;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Currently Displayed Objects in the Metropolitan Museum of Art by Country</h2>
  <svg id="map" width="1000" height="600"></svg>
  <button id="resetZoomBtn">Reset Zoom</button>
</div>


<div class="tooltip" style="opacity:0"></div>

<script src="./script.js"></script>

</body>
</html>
